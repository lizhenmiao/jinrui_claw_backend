server:
  port: 15000

spring:
  datasource:
    url: jdbc:h2:file:./data/xlx-admin;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: true
  h2:
    console:
      enabled: true
      path: /h2-console

xlx:
  crypto-secret: ${XLX_CRYPTO_SECRET:change-me-32-byte-secret-for-dev}
  jwt-secret: ${XLX_JWT_SECRET:change-me-jwt-secret-for-dev}
  jwt-ttl-seconds: ${XLX_JWT_TTL_SECONDS:86400}
  admin-username: ${XLX_ADMIN_USERNAME:admin}
  admin-password: ${XLX_ADMIN_PASSWORD:123456}
